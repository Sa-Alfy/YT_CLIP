# Viral clip pipeline — config
# Copy to config.local.yaml and edit for your own run; config.yaml ships with defaults.

# Topic: what this config discovers. Any subject works — a game, a
# hobby, a place, a food. --topic on the command line overrides this
# block; without it, the gta6 preset below is the default.
#   name          — the topic, used to build search terms and hooks.
#   search_terms  — explicit YouTube search terms. If omitted, terms
#                   are derived: the name plus "<name> gameplay" and
#                   "<name> walkthrough", plus extra_terms.
#   creators      — creator watchlist; discovery also searches
#                   "<name> <creator>" per creator. Empty = term
#                   search only (no creator search).
#   twitch_game   — Twitch game/category name. Blank ("") = YouTube-
#                   only; Twitch is skipped gracefully.
#   hook_strip    — words stripped from video titles when building the
#                   hook (defaults to the topic name).
#   exclude_video_ids — YouTube IDs to skip (see the note below).
topic:
  name: "GTA 6"
  search_terms:
    - "GTA 6 gameplay"
    - "GTA VI gameplay"
  creators:
    - Kai Cenat
    - IShowSpeed
    - caseoh_
    - Valkyrae
    - StableRonaldo
    - TheBurntPeanut
    - ElMariana
    - DarkViperAU
    - Caylus
    - Jelly
    - Rivers
    - Jake Baldino
    - Cinna
    - Payal Gaming
  twitch_game: "Grand Theft Auto VI"
  hook_strip:
    - "GTA 6"
    - "GTA VI"
    - "Grand Theft Auto VI"
    - "GTA6"
  # Videos to skip when picking clips (YouTube video IDs). Add a video
  # here after probing shows its window is not gameplay — the next-
  # ranked candidate takes its slot. probe.py verifies windows.
  # - KsNI7DeozPA (DarkViperAU, "The BEST GTA VI LAUNCH..."):
  #   pre-launch countdown stream; at 1800s it still showed a
  #   "releases in 0:39:43" countdown, at 4800s the in-game settings
  #   menu. No gameplay in the first ~80 min, so it is excluded.
  exclude_video_ids:
    - KsNI7DeozPA

# Named presets. --topic <name> loads that preset whole (CLI
# --creators / --game still override individual fields). `gta6` is
# the default preset and holds the exact launch-day values.
presets:
  gta6:
    name: "GTA 6"
    search_terms:
      - "GTA 6 gameplay"
      - "GTA VI gameplay"
    creators:
      - Kai Cenat
      - IShowSpeed
      - caseoh_
      - Valkyrae
      - StableRonaldo
      - TheBurntPeanut
      - ElMariana
      - DarkViperAU
      - Caylus
      - Jelly
      - Rivers
      - Jake Baldino
      - Cinna
      - Payal Gaming
    twitch_game: "Grand Theft Auto VI"
    hook_strip:
      - "GTA 6"
      - "GTA VI"
      - "Grand Theft Auto VI"
      - "GTA6"
    exclude_video_ids:
      - KsNI7DeozPA

discovery:
  search_results: 12        # results per search term
  creator_results: 2        # results per creator search
  max_age_hours: 72         # only videos uploaded within this window
  min_duration_s: 60        # skip videos shorter than this
  full_fetch_limit: 40      # full metadata fetches (top N by raw views)
  sleep_between_searches_s: 1.0

clips:
  length_s: 45              # target clip length (30-60)
  width: 1080
  height: 1920
  fps: 30
  crf: 21
  audio_bitrate: 128k
  hook_duration_s: 3        # hook text shown for the first N seconds
  subtitles: true           # burn in subtitles via faster-whisper (tiny)
  whisper_model: tiny
  whisper_language: en      # explicit language (no auto-detect — game
                            # audio + streamer chatter confuses it)

# Subprocess timeouts (seconds, v1.1). A stage that exceeds its timeout
# is killed (whole process group) and that clip fails — the run never
# hangs. clip_subprocess_s must cover download + transcribe + ffmpeg
# inside one clip.py call, so it is the largest.
timeouts:
  download_s: 1800          # yt-dlp segment download (throttled egress)
  transcribe_s: 900
  ffmpeg_s: 600
  ffprobe_s: 120
  clip_subprocess_s: 3600   # run_pipeline -> clip.py

paths:
  discovery: discovery
  clips: clips
  segments: segments
  # Python with faster-whisper installed (shared transcribe venv).
  transcribe_venv_python: ~/workspace/transcribe-venv/bin/python

# Twitch Helix discovery (top clips for the topic's game).
# Leave blank to skip Twitch gracefully — no data is faked.
# Get keys at https://dev.twitch.tv/console (free).
# The GAME name comes from the topic (topic.twitch_game), not here.
twitch:
  client_id: ""
  client_secret: ""
  top_clips: 10

# Commentary / reaction track (the format that keeps a clip channel alive).
# v1 ships clips with source audio only; a commentary track is mixed in
# here once recorded. Set enabled: true and point `audio` at a WAV/MP3
# of the same length as the clip, and clip.py will duck the source audio
# under it. See README.md.
commentary:
  enabled: false
  audio: null
