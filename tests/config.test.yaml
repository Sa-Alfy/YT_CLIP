# Test config for the v1.1 tests. Paths are relative to the tests/ dir
# (run_pipeline chdirs to the config's dir; run clip.py tests with
# cwd=tests/ too). Output is 720x1280 (NOT the 1080x1920 default) so
# a correct output proves the config actually reached clip.py.
search_terms:
  - "GTA 6 gameplay"
creators:
  - Kai Cenat

discovery:
  search_results: 3
  creator_results: 1
  max_age_hours: 72
  min_duration_s: 60
  full_fetch_limit: 5
  sleep_between_searches_s: 1.0

clips:
  length_s: 12
  width: 720
  height: 1280
  fps: 30
  crf: 28
  audio_bitrate: 96k
  hook_duration_s: 2
  subtitles: false
  whisper_model: tiny
  whisper_language: en

timeouts:
  download_s: 60
  transcribe_s: 60
  ffmpeg_s: 120
  ffprobe_s: 30
  clip_subprocess_s: 300

paths:
  discovery: out-discovery
  clips: out-clips
  segments: out-segments
  transcribe_venv_python: ~/workspace/transcribe-venv/bin/python

twitch:
  client_id: ""
  client_secret: ""
  game_name: "Grand Theft Auto VI"
  top_clips: 10

commentary:
  enabled: false
  audio: null
